              type: string
              title: Name
            price:
              type: string
              pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,8}|(?=[\d.]{1,11}0*$)\d{0,8}\.\d{0,2}0*$)
              title: Price
            available:
              type: boolean
              title: Available
              default: true
            store_id:
              anyOf:
                - type: string
                - type: "null"
              title: Store Id
            created_at:
              type: integer
              title: Created At
            updated_at:
              type: integer
              title: Updated At
            deleted_at:
              anyOf:
                - type: integer
                - type: "null"
              title: Deleted At
          type: object
          required:
            - name
            - price
          title: CatalogueModel
