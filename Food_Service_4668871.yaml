          properties:
            name:
              type: string
              title: Name
            price:
              anyOf:
                - type: number
                - type: string
                  pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,8}|(?=[\d.]{1,11}0*$)\d{0,8}\.\d{0,2}0*$)
              title: Price
            available:
              type: boolean
              title: Available
              default: true
            store_id:
              anyOf:
                - type: string
                - type: "null"
              title: Store Id
          type: object
          required:
            - name
            - price
          title: CatalogueSchema
        CatalogueUpdateSchema:
          properties:
            name:
              anyOf:
                - type: string
                - type: "null"
              title: Name
            price:
              anyOf:
                - type: number
                - type: string
                  pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,8}|(?=[\d.]{1,11}0*$)\d{0,8}\.\d{0,2}0*$)
                - type: "null"
              title: Price
            available:
              anyOf:
                - type: boolean
                - type: "null"
              title: Available
              default: true
          type: object
          required:
            - price
          title: CatalogueUpdateSchema
        ChannelEnum:
          type: string
          enum:
            - app
            - totem
            - counter
            - web
          title: ChannelEnum
          description: Onde o cliente faz o pedido.
        CostumerModel:
          properties:
            id:
              type: string
              title: Id
            name:
