spec:
  contents:
    openapi: 3.1.0
    info:
      title: Food Service API
      description: A RESTful API for managing a food service application.
      version: v1
    paths:
      /api/v1/employees/:
        get:
          tags:
            - employees
          summary: Get Employees
          operationId: get_employees_api_v1_employees__get
          parameters:
            - name: page
              in: query
              required: false
              schema:
                type: integer
                minimum: 1
                description: Page number
                default: 1
                title: Page
              description: Page number
            - name: page_size
              in: query
              required: false
              schema:
                type: integer
                maximum: 100
                minimum: 1
                description: Number of items per page
                default: 10
                title: Page Size
              description: Number of items per page
          responses:
            "200":
              description: Successful Response
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/PaginatedEmployeeResponse"
            "422":
              description: Validation Error
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/HTTPValidationError"
        post:
          tags:
            - employees
          summary: Create Employee
          operationId: create_employee_api_v1_employees__post
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/EmployeeSchema"
          responses:
            "201":
              description: Successful Response
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/EmployeeModel"
            "422":
              description: Validation Error
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/HTTPValidationError"
